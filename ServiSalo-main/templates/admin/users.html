{% extends "admin/base.html" %}
{% block title %}Usuarios{% endblock %}
{% block page_title %}Usuarios{% endblock %}

{% block content %}
<p class="admin-error" id="users-error" hidden></p>

<section class="admin-panel">
  <div class="admin-toolbar">
    <input type="search" class="admin-toolbar__input" id="users-search" placeholder="Buscar por nombre, correo o teléfono…" />

    <select class="admin-toolbar__select" id="users-account-type">
      <option value="">Persona y empresa</option>
      <option value="persona">Persona</option>
      <option value="empresa">Empresa</option>
    </select>

    <select class="admin-toolbar__select" id="users-sort">
      <option value="name">Ordenar por nombre</option>
      <option value="created_at">Ordenar por fecha de registro</option>
    </select>

    <select class="admin-toolbar__select" id="users-dir">
      <option value="asc">Ascendente</option>
      <option value="desc">Descendente</option>
    </select>
  </div>
  <div class="admin-table-wrap">
    <table class="admin-table" id="users-table">
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Teléfono</th>
          <th>Tipo</th>
          <th class="admin-table__center">Pedidos</th>
          <th class="admin-table__center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="5" class="admin-table__empty">Cargando…</td></tr>
      </tbody>
    </table>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/admin/users.js') }}"></script>
{% endblock %}
