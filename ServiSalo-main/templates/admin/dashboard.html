{% extends "admin/base.html" %}
{% block title %}Dashboard{% endblock %}
{% block page_title %}Dashboard{% endblock %}

{% block content %}
<section class="admin-cards" id="stats-cards">
  <p class="admin-loading">Cargando estadísticas…</p>
</section>

<section class="admin-panel">
  <div class="admin-panel__header">
    <h2 class="admin-panel__title">Últimas órdenes</h2>
    <a class="admin-link" href="{{ url_for('admin_orders_page') }}">Ver todas →</a>
  </div>
  <div class="admin-table-wrap">
    <table class="admin-table" id="recent-orders-table">
      <thead>
        <tr>
          <th>Orden</th>
          <th>Cliente</th>
          <th>Fecha</th>
          <th>Estado</th>
          <th class="admin-table__num">Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/admin/dashboard.js') }}"></script>
{% endblock %}
