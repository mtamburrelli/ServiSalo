{% extends "admin/base.html" %}
{% block title %}Órdenes{% endblock %}
{% block page_title %}Órdenes{% endblock %}

{% block content %}
<p class="admin-error" id="orders-error" hidden></p>

<section class="admin-panel">
  <div class="admin-toolbar">
    <input type="search" class="admin-toolbar__input" id="orders-search" placeholder="Buscar por cliente o correo…" />

    <select class="admin-toolbar__select" id="orders-status">
      <option value="">Todos los estados</option>
    </select>

    <select class="admin-toolbar__select" id="orders-sort">
      <option value="created_at">Ordenar por fecha</option>
      <option value="total_amount">Ordenar por total</option>
    </select>

    <select class="admin-toolbar__select" id="orders-dir">
      <option value="desc">Descendente</option>
      <option value="asc">Ascendente</option>
    </select>
  </div>
  <div class="admin-table-wrap">
    <table class="admin-table" id="orders-table">
      <thead>
        <tr>
          <th>Orden</th>
          <th>Cliente</th>
          <th>Fecha</th>
          <th class="admin-table__center">Estado</th>
          <th class="admin-table__num">Total</th>
          <th class="admin-table__center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="6" class="admin-table__empty">Cargando…</td></tr>
      </tbody>
    </table>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/admin/orders.js') }}"></script>
{% endblock %}
